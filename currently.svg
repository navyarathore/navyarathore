<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="'Ubuntu Mono','JetBrains Mono','DejaVu Sans Mono',monospace">
  <!-- window body (Catppuccin Mocha base) -->
  <rect x="1" y="1" width="718" height="338" rx="10" fill="#1e1e2e" stroke="#11111b" stroke-width="1.5"/>
  <!-- title bar (Mocha mantle) -->
  <path d="M1 11 A10 10 0 0 1 11 1 H709 A10 10 0 0 1 719 11 V40 H1 Z" fill="#181825"/>
  <line x1="1" y1="40" x2="719" y2="40" stroke="#11111b" stroke-width="1"/>
  <text x="360" y="25" text-anchor="middle" font-size="13" fill="#cdd6f4">navya@ubuntu: ~/currently</text>

  <!-- window controls (GNOME/Yaru, right side) -->
  <circle cx="648" cy="20" r="9" fill="#45475a"/>
  <line x1="643" y1="20" x2="653" y2="20" stroke="#cdd6f4" stroke-width="1.4"/>
  <circle cx="674" cy="20" r="9" fill="#45475a"/>
  <rect x="669.5" y="15.5" width="9" height="9" fill="none" stroke="#cdd6f4" stroke-width="1.3"/>
  <circle cx="700" cy="20" r="9" fill="#f38ba8"/>
  <line x1="696" y1="16" x2="704" y2="24" stroke="#11111b" stroke-width="1.4"/>
  <line x1="704" y1="16" x2="696" y2="24" stroke="#11111b" stroke-width="1.4"/>

  <!-- ===== p10k LEAN prompt (static context, appears immediately) ===== -->
  <!-- line 1: dir + git context -->
  <!-- folder icon (blue) -->
  <path d="M18 61 h7 l2 2 h9 v10 h-18 z" fill="#89b4fa"/>
  <text x="44" y="72" font-size="16" fill="#89b4fa" font-weight="bold">~/currently</text>
  <!-- git branch icon (green) -->
  <g stroke="#a6e3a1" stroke-width="1.6" fill="none" stroke-linecap="round">
    <circle cx="164" cy="61" r="2.4" fill="#a6e3a1" stroke="none"/>
    <circle cx="164" cy="73" r="2.4" fill="#a6e3a1" stroke="none"/>
    <circle cx="176" cy="61" r="2.4" fill="#a6e3a1" stroke="none"/>
    <line x1="164" y1="63.4" x2="164" y2="70.6"/>
    <path d="M176 63.4 v2 a6 6 0 0 1 -6 6 h-4"/>
  </g>
  <text x="186" y="72" font-size="16" fill="#a6e3a1">main</text>
  <!-- clean checkmark (green) -->
  <path d="M232 67 l3 3 l6 -7" stroke="#a6e3a1" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- line 2: prompt char (drawn chevron, mauve) -->
  <path d="M18 94 l8 6 l-8 6" stroke="#cba6f7" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- typed command (hybrid: smooth glide with burst hitches) -->
  <clipPath id="cmd"><rect x="40" y="86" width="0" height="24"><animate attributeName="width" values="0;47;47;117;117;175;210" keyTimes="0;0.20;0.26;0.50;0.56;0.80;1" dur="1.6s" calcMode="linear" begin="0.4s" fill="freeze"/></rect></clipPath>
  <g clip-path="url(#cmd)">
    <text x="40" y="102" font-size="16" fill="#cdd6f4">whoami --currently</text>
  </g>

  <!-- command cursor: glides + hitches with typing, blinks once, then hides -->
  <rect y="87" width="9" height="18" fill="#cdd6f4">
    <animate attributeName="x" values="40;87;87;157;157;215;250" keyTimes="0;0.20;0.26;0.50;0.56;0.80;1" dur="1.6s" calcMode="linear" begin="0.4s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1;0" keyTimes="0;0.4;0.7;1" dur="0.6s" begin="2.0s" fill="freeze"/>
  </rect>

  <!-- ===== output bullets (quick fade, mauve triangle markers) ===== -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.15s" fill="freeze"/>
    <path d="M20 134 l7 4 l-7 4 z" fill="#cba6f7"/>
    <text x="36" y="142" font-size="15" fill="#cdd6f4">Building cloud-native systems on Azure / AWS / GCP</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.15s" fill="freeze"/>
    <path d="M20 162 l7 4 l-7 4 z" fill="#cba6f7"/>
    <text x="36" y="170" font-size="15" fill="#cdd6f4">Deep-diving CI/CD, deployment automation &amp; scalable infra</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.15s" fill="freeze"/>
    <path d="M20 190 l7 4 l-7 4 z" fill="#cba6f7"/>
    <text x="36" y="198" font-size="15" fill="#cdd6f4">Sharpening DSA for stronger problem-solving &amp; design</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.15s" fill="freeze"/>
    <path d="M20 218 l7 4 l-7 4 z" fill="#cba6f7"/>
    <text x="36" y="226" font-size="15" fill="#cdd6f4">Exploring modern IaC &amp; observability tooling</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.15s" fill="freeze"/>
    <path d="M20 246 l7 4 l-7 4 z" fill="#cba6f7"/>
    <text x="36" y="254" font-size="15" fill="#cdd6f4">Ask me about DevOps, containers, pipelines</text>
  </g>

  <!-- ===== trailing p10k lean prompt + blinking cursor ===== -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.7s" dur="0.15s" fill="freeze"/>
    <path d="M18 281 h7 l2 2 h9 v10 h-18 z" fill="#89b4fa"/>
    <text x="44" y="292" font-size="16" fill="#89b4fa" font-weight="bold">~/currently</text>
    <g stroke="#a6e3a1" stroke-width="1.6" fill="none" stroke-linecap="round">
      <circle cx="164" cy="281" r="2.4" fill="#a6e3a1" stroke="none"/>
      <circle cx="164" cy="293" r="2.4" fill="#a6e3a1" stroke="none"/>
      <circle cx="176" cy="281" r="2.4" fill="#a6e3a1" stroke="none"/>
      <line x1="164" y1="283.4" x2="164" y2="290.6"/>
      <path d="M176 283.4 v2 a6 6 0 0 1 -6 6 h-4"/>
    </g>
    <text x="186" y="292" font-size="16" fill="#a6e3a1">main</text>
    <path d="M232 287 l3 3 l6 -7" stroke="#a6e3a1" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 314 l8 6 l-8 6" stroke="#cba6f7" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="307" width="9" height="18" fill="#cdd6f4">
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" begin="3.9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
