<svg xmlns="http://www.w3.org/2000/svg" width="450" height="120" viewBox="0 0 450 120" font-family="'Poppins','Segoe UI',system-ui,'Helvetica Neue',sans-serif">
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5c2e7"/>
      <stop offset="0.5" stop-color="#cba6f7"/>
      <stop offset="1" stop-color="#89b4fa"/>
    </linearGradient>
  </defs>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.1s" fill="freeze"/>

    <!-- greeting -->
    <text x="225" y="40" text-anchor="middle" font-size="22" font-weight="500" fill="#a6adc8">Hello! I am</text>

    <!-- name (Catppuccin gradient) + nerd emoji -->
    <text x="225" y="94" text-anchor="middle" font-size="46" font-weight="700">
      <tspan fill="url(#name)">Navya Rathore</tspan><tspan font-size="40"> 🤓</tspan>
    </text>
  </g>
</svg>
